[project]
name = "backtesting-engine-web"
version = "0.2.0"
description = "Event Driven Trading Strategy Backtesting"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps only: these are what Pyodide loads in the browser and what the
# CLI entry points need. yfinance/tqdm are used solely by downloader.py, which
# is a developer tool, so they live in the dev group instead.
dependencies = [
    "numpy",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "yfinance",
    "tqdm",
    # Cross-validation reference engine. Pinned exactly so the backtrader
    # comparison is reproducible. CLI-only - never imported by the engine or
    # the browser bundle.
    "backtrader==1.9.78.123",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The validation scripts bootstrap sys.path with the repo root before importing
# the engine modules, so their engine imports legitimately follow a statement.
"validation/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: tests that hit external services; excluded in CI"]

[tool.mypy]
# Python min version is 3.11, but numpy's bundled stubs use PEP 695 `type`
# statements, which mypy refuses to parse below 3.12, it aborts before
# checking any project code. The runtime floor stays >=3.11; ruff's
# target-version = "py311" is what guards against 3.12-only syntax.
python_version = "3.12"
check_untyped_defs = true
# web_main.py is excluded because its pyscript/pyodide imports only resolve
# inside the browser. .venv is excluded so `mypy .` does not walk site-packages.
exclude = ["web_main\\.py", "\\.venv"]

[[tool.mypy.overrides]]
module = [
    "event",
    "engine",
    "data",
    "portfolio",
    "execution",
    "performance",
    "position_sizing",
    "strategy",
    "strategies.*",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["pandas.*", "yfinance.*", "tqdm.*", "backtrader.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Bare --cov in CI measures the whole project; keep tests and the virtualenv
# out of the report. No coverage threshold is set, the golden and performance
# tests are the point, not a percentage.
omit = ["tests/*", ".venv/*"]
